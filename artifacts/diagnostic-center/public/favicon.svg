<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <linearGradient id="oxyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#042F2E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle with Brand Gradient -->
  <rect width="180" height="180" rx="42" fill="url(#oxyBg)" />
  <rect x="2" y="2" width="176" height="176" rx="40" stroke="rgba(255,255,255,0.22)" stroke-width="3" fill="none" />

  <!-- Bold Clinical Cross in Crisp White -->
  <path d="M68 34h44a8 8 0 0 1 8 8v26h26a8 8 0 0 1 8 8v44a8 8 0 0 1-8 8h-26v26a8 8 0 0 1-8 8H68a8 8 0 0 1-8-8v-26H34a8 8 0 0 1-8-8V76a8 8 0 0 1 8-8h26V42a8 8 0 0 1 8-8z" fill="#FFFFFF" filter="url(#glow)"/>

  <!-- Diagnostic ECG Pulse Wave Cutting Through Center -->
  <path d="M42 90h26l7-18 11 36 10-24 6 9 20-3h16" stroke="url(#pulseGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Vital Signal Marker -->
  <circle cx="138" cy="90" r="4.5" fill="#0D9488" />
</svg>
